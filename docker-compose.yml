services:
  # ─── MongoDB ───────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: map_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: map_data_generator
    networks:
      - app_network

  # ─── Backend (Node / Express) ───────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: map_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    # Secrets (JWT, Razorpay, API keys) come from server/.env
    env_file:
      - ./server/.env
    # Container-specific overrides
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URL: mongodb://mongo:27017/map_data_generator
      FRONTEND_URL: http://localhost
    networks:
      - app_network

  # ─── Frontend (React / Vite → Nginx) ───────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: map_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - app_network

volumes:
  mongo_data:

networks:
  app_network:
    driver: bridge
